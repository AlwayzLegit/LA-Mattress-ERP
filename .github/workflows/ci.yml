name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jetnine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_test
      TENANCY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_tenancy
      AUDIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_audit
      ADMIN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_admin
      BUSINESS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_business
      CATALOG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_catalog
      INVENTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_inventory
      CUSTOMERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_customers
      SALES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_sales
      ORDERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_orders
      DELIVERIES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_deliveries
      SPECIALS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_specials
      EXCHANGES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_exchanges
      MONEY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_money
      SERVICE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_service
      IMPORT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_import
      INTEGRATIONS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_integrations
      MARKETING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_marketing
      REPORTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_reports
      BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_billing
      STRIPE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_stripe
      PURCHASING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_purchasing
      TRANSFERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_transfers
      TAXES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_taxes
      DISCOUNTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_discounts
      WEBHOOKS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_webhooks
      API_KEYS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_api_keys
      IDEMPOTENCY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_idempotency
      PAGINATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_pagination
      OPENAPI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_openapi
      GIFT_CARDS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_gift_cards
      ONBOARDING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_onboarding
      CONTROLS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_controls
      CLOSEOUT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_closeout
      REPORT_BUILDER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_report_builder
      GL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_gl
      SPLITPAY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_splitpay
      OPS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_ops
      WAREHOUSE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_warehouse
      CASHIER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_cashier
      ORDER_NOTES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_order_notes
      TEAM_WORKFLOWS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_team_workflows
      PRODUCT_FILTERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_product_filters
      AS_IS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_as_is
      ORDER_DETAIL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_order_detail
      CUSTOMER_ACTIVITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_customer_activity
      SALESPERSON_ACTIVITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_salesperson_activity
      CASH_DRAWER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_cash_drawer
      WRITTEN_SALES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_written_sales
      VENDOR_SETTINGS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_vendor_settings
      OWNER_DASHBOARD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_owner_dashboard
      CATALOG_CLEANUP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_catalog_cleanup
      CATALOG_IMPORT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_catalog_import
      PRODUCT_STOCK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_product_stock
      STORE_DASHBOARD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_store_dashboard
      SCHEDULE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_schedule
      ORDER_ACTIONS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_order_actions
      PRODUCT_ACTIVITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_product_activity
      TRANSFERS_SWEEP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_transfers_sweep
      STOCK_ADJUSTMENT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_stock_adjustment
      REPLENISH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_replenish
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Provision auxiliary test DBs
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres jetnine_tenancy
          createdb -h localhost -U postgres jetnine_audit
          createdb -h localhost -U postgres jetnine_admin
          createdb -h localhost -U postgres jetnine_business
          createdb -h localhost -U postgres jetnine_catalog
          createdb -h localhost -U postgres jetnine_inventory
          createdb -h localhost -U postgres jetnine_customers
          createdb -h localhost -U postgres jetnine_sales
          createdb -h localhost -U postgres jetnine_orders
          createdb -h localhost -U postgres jetnine_order_actions
          createdb -h localhost -U postgres jetnine_product_activity
          createdb -h localhost -U postgres jetnine_transfers_sweep
          createdb -h localhost -U postgres jetnine_stock_adjustment
          createdb -h localhost -U postgres jetnine_replenish
          createdb -h localhost -U postgres jetnine_deliveries
          createdb -h localhost -U postgres jetnine_specials
          createdb -h localhost -U postgres jetnine_exchanges
          createdb -h localhost -U postgres jetnine_money
          createdb -h localhost -U postgres jetnine_service
          createdb -h localhost -U postgres jetnine_import
          createdb -h localhost -U postgres jetnine_integrations
          createdb -h localhost -U postgres jetnine_marketing
          createdb -h localhost -U postgres jetnine_reports
          createdb -h localhost -U postgres jetnine_billing
          createdb -h localhost -U postgres jetnine_stripe
          createdb -h localhost -U postgres jetnine_purchasing
          createdb -h localhost -U postgres jetnine_transfers
          createdb -h localhost -U postgres jetnine_taxes
          createdb -h localhost -U postgres jetnine_discounts
          createdb -h localhost -U postgres jetnine_webhooks
          createdb -h localhost -U postgres jetnine_api_keys
          createdb -h localhost -U postgres jetnine_idempotency
          createdb -h localhost -U postgres jetnine_pagination
          createdb -h localhost -U postgres jetnine_openapi
          createdb -h localhost -U postgres jetnine_gift_cards
          createdb -h localhost -U postgres jetnine_onboarding
          createdb -h localhost -U postgres jetnine_controls
          createdb -h localhost -U postgres jetnine_closeout
          createdb -h localhost -U postgres jetnine_report_builder
          createdb -h localhost -U postgres jetnine_gl
          createdb -h localhost -U postgres jetnine_splitpay
          createdb -h localhost -U postgres jetnine_ops
          createdb -h localhost -U postgres jetnine_warehouse
          createdb -h localhost -U postgres jetnine_cashier
          createdb -h localhost -U postgres jetnine_order_notes
          createdb -h localhost -U postgres jetnine_team_workflows
          createdb -h localhost -U postgres jetnine_product_filters
          createdb -h localhost -U postgres jetnine_as_is
          createdb -h localhost -U postgres jetnine_order_detail
          createdb -h localhost -U postgres jetnine_customer_activity
          createdb -h localhost -U postgres jetnine_salesperson_activity
          createdb -h localhost -U postgres jetnine_cash_drawer
          createdb -h localhost -U postgres jetnine_written_sales
          createdb -h localhost -U postgres jetnine_vendor_settings
          createdb -h localhost -U postgres jetnine_owner_dashboard
          createdb -h localhost -U postgres jetnine_catalog_cleanup
          createdb -h localhost -U postgres jetnine_catalog_import
          createdb -h localhost -U postgres jetnine_product_stock
          createdb -h localhost -U postgres jetnine_store_dashboard
          createdb -h localhost -U postgres jetnine_schedule

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright E2E (auth)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jetnine_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jetnine_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @jetnine/web exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter @jetnine/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  migration-drift:
    name: Drizzle migration drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate migrations from the current schema. If the working tree is
      # dirty afterwards, schema changes were committed without a matching
      # migration file — fail the build with a useful diff.
      - name: Generate migrations from schema
        run: pnpm --filter @jetnine/db generate
        continue-on-error: false

      - name: Verify no untracked schema changes
        run: |
          if ! git diff --quiet --exit-code -- packages/db/drizzle; then
            echo "::error::Schema changes detected without a matching migration."
            echo "Run 'pnpm db:generate' locally and commit the result."
            git diff -- packages/db/drizzle
            exit 1
          fi
